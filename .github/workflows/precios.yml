name: Actualizar precios

# De lunes a viernes, cada 30 minutos (minutos 7 y 37: GitHub descarta o atrasa más las corridas de la hora en punto y la media hora) mientras opera la bolsa de Santiago (09:30 a 17:00 hora de Chile), más una
# corrida después del cierre. Cada corrida trae de Yahoo Finance el último valor del día y reemplaza la fila de hoy:
# en cada serie hay una sola fila por fecha. Las corridas sin datos nuevos no guardan nada.
#
# GitHub programa en UTC y Chile cambia de horario (UTC-3 en verano, UTC-4 en invierno). Las 12:07 a 21:37 UTC
# cubren la rueda en ambos horarios; las 22:22 y 23:22 UTC caen después del cierre. GitHub puede atrasar una
# ejecución programada unos minutos. Se puede lanzar a mano desde Actions > "Actualizar precios" > Run workflow.
on:
  schedule:
    - cron: '7,37 12-21 * * 1-5'
    - cron: '22 22,23 * * 1-5'
  workflow_dispatch:
    inputs:
      completo:
        description: 'Bajar de nuevo los 15 años de historia'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Precios desde Yahoo Finance
        env:
          PYTHONUTF8: '1'
        # Cada 30 minutos en la rueda (minutos 7 y 37): solo el último precio, ajustado y sin ajustar. La corrida de después del
        # cierre (22:22 y 23:22 UTC) y las manuales revisan además los últimos días y los ajustes por dividendos; "completo" baja los 15 años.
        run: |
          if [ "${{ inputs.completo }}" = "true" ]; then
            python update_data.py --completo
          elif [ "${{ github.event.schedule }}" = "7,37 12-21 * * 1-5" ]; then
            python update_data.py --ultimo
          else
            python update_data.py
          fi

      # Se guarda siempre lo que se alcanzó a actualizar: un instrumento con error conserva su serie anterior.
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet -- data/prices && { echo "Sin cambios de precios"; git restore --staged data; exit 0; }
          git commit -m "Precios $(TZ=America/Santiago date '+%F %H:%M')"
          git pull --rebase -q || true
          git push

      # Si fallan muchos instrumentos (p. ej. Yahoo bloquea al servidor), el trabajo queda en rojo y GitHub avisa por correo.
      - name: Revisar errores
        if: always()
        run: python .github/revisar_manifest.py
